spring:
  application:
    name: backend
  
  datasource:
    url: jdbc:h2:mem:uilibrary;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Let Flyway handle schema creation
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:test}
            client-secret: ${GITHUB_CLIENT_SECRET:test}

server:
  port: 8080
  
jwt:
  secret: ${JWT_SECRET:veryLongSecretKeyThatIsAtLeast256BitsForHS256Algorithm1234567890}
  expiration: 86400000 # 24 hours in ms
  refresh-expiration: 604800000 # 7 days in ms

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.uilibrary: DEBUG
